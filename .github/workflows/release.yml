name: Release binary

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [x86_64-unknown-linux-gnu, x86_64-apple-darwin, x86_64-pc-windows-msvc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up cross-compilation toolchain
        if: matrix.os != 'ubuntu-latest'
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            rustup target add x86_64-pc-windows-msvc
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            rustup target add x86_64-apple-darwin
          fi

      - name: Build
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --target ${{ matrix.target }}
          fi

      - name: Rename binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              mv target/${{ matrix.target }}/release/omni target/${{ matrix.target }}/release/omni-x86_64
              ;;
            macos-latest)
              mv target/${{ matrix.target }}/release/omni target/${{ matrix.target }}/release/omni-x86_64-macos
              ;;
            windows-latest)
              mv target/${{ matrix.target }}/release/omni.exe target/${{ matrix.target }}/release/omni-x86_64-windows.exe
              ;;
          esac

      - name: Upload binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/*
          generate_release_notes: true